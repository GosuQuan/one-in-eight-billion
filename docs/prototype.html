<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>原型预览 / 界面流程 · 80亿分之1</title>
<style>
:root{color-scheme:light;--bg:#edf1eb;--paper:#fafbf7;--ink:#263a3b;--muted:#708078;--wine:#922b4c;--line:#ced7cd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #367e74;outline-offset:4px}.shell{max-width:1600px;margin:auto;padding:30px 40px}header{display:flex;align-items:center;justify-content:space-between;padding-bottom:25px;border-bottom:1px solid var(--line);gap:20px}.brand{font-family:Georgia,"Songti SC",serif;font-size:29px;letter-spacing:-1px}.brand em{color:var(--wine);font-style:normal}.tag{font:10px system-ui;letter-spacing:2px;border:1px solid var(--line);padding:6px 8px;margin-left:14px;vertical-align:middle}header a{font-size:13px}.layout{display:grid;grid-template-columns:242px minmax(0,1fr);gap:40px;margin-top:33px}.eyebrow{font-size:10px;letter-spacing:2.5px;color:var(--wine)}h1{font-size:24px;font-weight:500;margin:9px 0}aside p{font-size:12px;color:var(--muted);margin:0 0 24px}nav{display:grid;gap:7px}nav button{background:transparent;border:1px solid transparent;text-align:left;padding:13px 12px;color:var(--muted);display:flex;align-items:center;gap:15px}nav button span{font:12px Georgia;color:var(--wine)}nav button.active{color:var(--ink);border-color:var(--line);background:var(--paper);box-shadow:3px 3px 0 #dfe6dc}nav button.active:after{content:'↗';margin-left:auto;color:var(--wine)}.try{display:block;background:var(--wine);color:white;padding:13px 17px;margin-top:28px;letter-spacing:1px;font-size:13px}.aside-note{font-size:11px;color:var(--muted);margin-top:15px}.stage-head{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-bottom:21px}.stage-head h2{font-weight:500;font-size:27px;margin:0 0 6px}.stage-head p{margin:0;font-size:13px;color:var(--muted)}.counter{font:20px Georgia;color:var(--wine);white-space:nowrap}.browser{background:var(--paper);border:1px solid var(--line);box-shadow:0 12px 40px #263a3b08}.chrome{height:37px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 15px;gap:5px;font-size:10px;color:var(--muted)}.chrome i{height:6px;width:6px;background:#c7d1c6;border-radius:50%}.chrome span{margin-left:12px;letter-spacing:1px}.viewport{height:650px;overflow:auto;padding:15px;display:flex;align-items:start;justify-content:center;background:#e3e9e0}.viewport img{display:block;max-width:100%;height:auto;border:1px solid #cbd4c9}.viewport.mobile img{width:360px}.bar{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:15px}.bar button{border:1px solid var(--line);padding:9px 17px;background:var(--paper);color:var(--ink)}.bar button:disabled{opacity:.35;cursor:default}.dots{display:flex;gap:7px}.dots button{width:8px;height:8px;border:0;padding:0;background:#c8d3c8;border-radius:50%}.dots button.active{background:var(--wine)}footer{margin-top:36px;padding-top:22px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:15px}.hint{font-size:11px;color:var(--muted);margin-top:14px} @media(min-width:1600px){.viewport{height:740px}}@media(max-width:900px){.shell{padding:20px}.layout{grid-template-columns:1fr;gap:22px;margin-top:23px}nav{grid-template-columns:repeat(3,1fr);gap:4px}nav button{font-size:12px;padding:10px 6px;gap:7px}nav button.active:after{display:none}aside p{margin-bottom:15px}.try{display:inline-block;margin-top:15px}.aside-note{display:none}.viewport{height:60vh;padding:8px}.stage-head h2{font-size:22px}.tag{margin-left:8px;font-size:8px}.brand{font-size:24px}header{gap:8px}.hint{display:none}footer{display:block}footer a{display:inline-block;margin-top:8px}}@media(prefers-reduced-motion:no-preference){.browser{animation:appear .3s ease}@keyframes appear{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="shell">
<header><a class="brand" href="../index.html">80亿分之<em>1</em><span class="tag">PROTOTYPE</span></a><a href="https://github.com/GosuQuan/one-in-eight-billion" target="_blank" rel="noopener">查看源码 ↗</a></header>
<div class="layout">
<aside><div class="eyebrow">INTERFACE FLOW / 09 STAGES</div><h1>原型预览 / 界面流程</h1><p>用真实界面截图，浏览一段人生的起承转合。</p><nav aria-label="界面阶段" id="nav"></nav><a class="try" href="../index.html">进入游戏 Demo，在线试玩 ↗</a><p class="aside-note">这是截图交互原型。使用左侧导航浏览界面，游戏操作请进入在线试玩。</p></aside>
<main><div class="stage-head"><div><h2 id="title"></h2><p id="description"></p></div><div class="counter" id="counter"></div></div><div class="browser"><div class="chrome"><i></i><i></i><i></i><span>80亿分之1 · 真实界面截图</span></div><div class="viewport" id="viewport"><img id="screen" alt=""></div></div><div class="bar"><button id="prev" type="button">← 上一步</button><div class="dots" id="dots" aria-label="切换阶段"></div><button id="next" type="button">下一步 →</button></div><p class="hint">← → 键切换阶段 · 截图区域可滚动查看完整页面 · 本页可直接从本地打开</p><p role="status" aria-live="polite" id="status" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></p></main>
</div><footer><span>独立复刻 Demo · 截图原型用于展示页面与流程，非原站官方产品。</span><span><a href="prototype.png" target="_blank">原型总览 ↗</a>　·　<a href="demo.gif" target="_blank">查看完整演示 GIF ↗</a></span></footer>
</div>
<script>
const stages=[
['世界 / 首页','设置出生时代、抽选方式与节奏，让故事从偶然开始。','desktop-home.png'],
['出生证','查看随机身份、出生城市与家庭起点，准备开始这一生。','desktop-birth.png'],
['生活仪表盘','档案与状态、像素场景、年度重心和人生记录，在同一屏展开。','desktop-life.png'],
['人生的岔路口','在成长的关键节点作出选择，新的经历会继续写进记录。','desktop-choice.png'],
['投资 · 资产','配置存款、基金、债券、股票，也可以买房、买保险。','feature-invest-overview.png'],
['去旅行','从国内慢旅行到海外目的地，选择同行的人。','feature-travel.png'],
['意外事件','随机事件在年度里敲门，有时需要你作出选择。','feature-event.png'],
['人生终章','回顾走过的年岁与重要片刻，留一句话，再开始另一种可能。','desktop-ending.png'],
['移动端体验','在手机布局中继续推进时间、浏览人生与作出抉择。','mobile-life.png']
];
let current=0;const $=id=>document.getElementById(id);const nav=$('nav'),dots=$('dots');
stages.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML='<span>'+String(i+1).padStart(2,'0')+'</span>'+s[0];b.onclick=()=>show(i);nav.append(b);const dot=document.createElement('button');dot.type='button';dot.setAttribute('aria-label','查看'+s[0]);dot.onclick=()=>show(i);dots.append(dot)});
function show(i){current=Math.max(0,Math.min(stages.length-1,i));const [title,description,file]=stages[current];$('title').textContent=title;$('description').textContent=description;$('counter').textContent=String(current+1).padStart(2,'0')+' / '+String(stages.length).padStart(2,'0');$('screen').src='screenshots/'+file;$('screen').alt=title+' — 游戏 Demo 实际界面截图';$('viewport').classList.toggle('mobile',current===stages.length-1);$('viewport').scrollTop=0;[...nav.children].forEach((b,j)=>{b.classList.toggle('active',j===current);b.setAttribute('aria-current',j===current?'step':'false')});[...dots.children].forEach((b,j)=>b.classList.toggle('active',j===current));$('prev').disabled=current===0;$('next').disabled=current===stages.length-1;$('status').textContent='第'+(current+1)+'阶段：'+title;location.hash='stage-'+(current+1)}
$('prev').onclick=()=>show(current-1);$('next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}});window.addEventListener('hashchange',()=>{const n=Number(location.hash.replace('#stage-',''));if(n>=1&&n<=stages.length&&n!==current+1)show(n-1)});show(Number(location.hash.replace('#stage-',''))-1||0);
</script>
</body>
</html>
